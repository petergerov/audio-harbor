name: AudioHarbor
options:
  bundleIdPrefix: app.audioharbor
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  CURRENT_PROJECT_VERSION: "1"
  MARKETING_VERSION: "0.1.0"
targets:
  AudioHarbor:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AudioHarbor
        excludes:
          - Resources/Info.plist
          - Resources/AudioHarbor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.audioharbor.player
        PRODUCT_NAME: AudioHarbor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AudioHarbor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AudioHarbor/Resources/AudioHarbor.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Audio Harbor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: AudioHarbor/Resources/AudioHarbor.entitlements
schemes:
  AudioHarbor:
    build:
      targets:
        AudioHarbor: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
