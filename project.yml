name: AudioHarbor
options:
  bundleIdPrefix: com.gerov.audioharbor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  CURRENT_PROJECT_VERSION: "4"
  MARKETING_VERSION: "1.0.0"
targets:
  AudioHarbor:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: AudioHarbor
        excludes:
          - Resources/Info.plist
          - Resources/AudioHarbor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerov.audioharbor.player
        PRODUCT_NAME: AudioHarbor
        DEVELOPMENT_TEAM: C9LBGZNZ6P
        SWIFT_OBJC_BRIDGING_HEADER: AudioHarbor/Resources/AudioHarbor-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AudioHarbor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AudioHarbor/Resources/AudioHarbor.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Audio Harbor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        AD_HOC_CODE_SIGNING_ALLOWED: YES
    # XcodeGen writes this file on every generate. The keys MUST live here --
    # an `entitlements:` block without `properties` emits an empty <dict/>, which
    # is what got the first App Store upload rejected for a missing sandbox.
    entitlements:
      path: AudioHarbor/Resources/AudioHarbor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
schemes:
  AudioHarbor:
    build:
      targets:
        AudioHarbor: all
    run:
      config: Debug
      storeKitConfiguration: AudioHarbor/Resources/AudioHarbor.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
